# Cloudflare Worker that connects Train to Strava. Setup steps: README → "Strava sync".
name = "train-strava"
main = "strava-worker.js"
compatibility_date = "2026-09-01"

[vars]
APP_URL = "https://clearjanuary.github.io/training-programme/"
# From strava.com/settings/api (the Client ID is not secret).
STRAVA_CLIENT_ID = ""

# Created with: npx wrangler kv namespace create STRAVA_PENDING
[[kv_namespaces]]
binding = "STRAVA_PENDING"
id = ""

# The client secret is never stored here. Set it with:
#   npx wrangler secret put STRAVA_CLIENT_SECRET
